# exp_static2019_1_reg :: train :: europa_alpha_concat_N1
# region=europa embed=alpha arch=concat N=1 (static 2019 embedding).
# Lives at conf root (not a subdir) so `dataset:` group defaults and
# HydraConfig.runtime.choices.dataset (train.py:133) resolve natively.
hydra:
  job:
    chdir: false
    name: exp_static2019_1_reg_europa_alpha_concat_N1
  run:
    dir: ./output/${hydra:job.name}
  searchpath:
    - pkg://conf/base
defaults:
  - dataset: europa
  - model: regression
  - model_size: normal
  - training: ${model}
  - val_times_2021@_val_times
  - exp_static2019_1_reg_common_train
  - _self_
dataset:
  data_path: /anvme/workspace/b214cb18-ws-daniel2/wuerzburg450_corrdiff.zarr
  embedding_path: /home/vault/b214cb/b214cb18/regrid2/alpha/zarr/gcs_eu_2019_N1.zarr
  embedding_n: 1
model:
  embed: alpha
  embed_version: static2019_concat_N1
training:
  perf:
    torch_compile: true
wandb:
  tags: [exp_static2019_1_reg, europa, alpha, concat, N1, static2019]
