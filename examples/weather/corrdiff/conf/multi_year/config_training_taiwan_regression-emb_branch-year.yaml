# Taiwan regression with YEAR-MATCHED Alpha Earth embeddings, dual-branch model.
# "v.emb_branch.year.1": the last 64 (alpha) input channels are split off and
# processed by a parallel CNN branch (SongUNetEmbBranch), fused before the first
# downsampling. Each sample now sees the embedding of its OWN year.

hydra:
    job:
          chdir: false
          name: taiwan_regression_alpha_v2_year_branch
    run:
          dir: ./output/${hydra:job.name}
    searchpath:
          - pkg://conf/base # Do not modify

defaults:
    - dataset: cwb
    - model: regression
    - model_size: normal
    - training: ${model}
    - val_times_2021@_val_times

# Year-matched Alpha Earth embeddings (registry resolves region/channels).
dataset:
    data_path: /data/cwa_dataset.zarr
    # Pin the 4 cwb output channels explicitly (matches base cwb.yaml default).
    out_channels: [0, 1, 2, 3]
    embedding_source: alpha
    embedding_version: v2_year
    embedding_root: /home/vault/b214cb/b214cb18/regrid2

# Model: dual-branch architecture — parallel CNN for satellite embeddings.
# The alpha_earth channels (last 64 of the input) are split off and processed
# by a shallow parallel CNN; features are fused before the first downsampling.
# embed/embed_version ONLY build the wandb run name (train.py:135); no model effect.
# Kept numerically consistent with dataset.embedding_version (v2_year); suffix = arch.
model:
    embed: alpha                 # none | alpha | olmo
    embed_version: v2_year_branch   # year-matched (v2_year) via the parallel CNN branch
    model_args:
        "N_grid_channels": 4
        "embedding_type": "zero"
        "model_type": "SongUNetEmbBranch"
        "alpha_earth_channels": 64   # must match dataset embedding channels (alpha n1 = 64; olmo = 128)
        "emb_branch_channels": 64    # output channels of the parallel CNN branch (tunable)

# Training parameters
training:
    hp:
        training_duration: 2_000_000
        lr_rampup: 10_000
        total_batch_size: 256
        batch_size_per_gpu: 4
    io:
      print_progress_freq: 4000
      save_n_recent_checkpoints: 15
      checkpoint_dir: /checkpoints/taiwan/alpha-v2_year_branch
      save_checkpoint_freq: 100_000
    perf:
      # SongUNetEmbBranch re-implements SongUNet.forward (Python loop over enc/dec
      # blocks + gradient checkpointing), which torch.compile tends to graph-break
      # on. Left off to avoid surprises; flip to true and watch the first-step log
      # if you want to try it.
      torch_compile: false

validation:
    train: false
    all_times: false
    include_times: ${_val_times.times}

# Parameters for wandb logging
wandb:
    mode: online
    results_dir: "./wandb"
    watch_model: false
    resume_id: null
    tags: [alpha, v2_year, branch]   # override on CLI: 'wandb.tags=[...]'
