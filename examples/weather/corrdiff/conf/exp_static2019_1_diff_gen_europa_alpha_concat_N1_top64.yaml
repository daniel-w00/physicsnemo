# exp_static2019_1_diff :: generate :: europa_alpha_concat_N1 :: top64
# Full CorrDiff inference (regression mean + diffusion residual), 16 ensembles,
# top64 split. Mirrors the Europa diffusion baseline but feeds the
# alpha embeddings and points at this run's checkpoints.
# embedding_path MUST be set — both reg and diffusion models were trained with it.
hydra:
  job:
    chdir: false
    name: gen_exp_static2019_1_diff_europa_alpha_concat_N1_top64
  run:
    dir: ./outputs/${hydra:job.name}
  searchpath:
    - pkg://conf/base
defaults:
  - dataset: europa
  - generation: non_patched
  - timestamps_top64@_eval_times
  - _self_
dataset:
  data_path: /anvme/workspace/b214cb18-ws-daniel2/wuerzburg450_corrdiff.zarr
  embedding_path: /home/vault/b214cb/b214cb18/regrid2/alpha/zarr/gcs_eu_2019_N1.zarr
  embedding_n: 1
  train: False
  all_times: True
generation:
  num_ensembles: 16
  seed_batch_size: 16
  hr_mean_conditioning: true
  inference_mode: all
  save_input: false
  times_range: null
  times: ${_eval_times.times}
  io:
    reg_ckpt_filename: /checkpoints/exp_static2019_1_reg/europa_alpha_concat_N1/v1/checkpoints_regression/UNet.0.2000128.mdlus
    res_ckpt_filename: /checkpoints/exp_static2019_1_diff/europa_alpha_concat_N1/v1/checkpoints_diffusion/EDMPrecondSuperResolution.0.2000128.mdlus
    output_filename: /home/vault/b214cb/b214cb18/generated/exp_static2019_1_diff/europa_alpha_concat_N1/europa_alpha_concat_N1_top64.nc
wandb:
  mode: offline
  results_dir: "./wandb"
