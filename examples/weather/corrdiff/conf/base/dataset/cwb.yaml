# Dataset type. Do not modify.
type: cwb
# Path to data file. Must be overridden.
data_path: ???
# Indices of input channels
in_channels: [0, 1, 2, 3, 4, 9, 10, 11, 12, 17, 18, 19]
# Indices of output channels
out_channels: [0, 1, 2, 3]
# Shape of the image
img_shape_x: 448  # domain width
img_shape_y: 448  # domain height
# Add grid coordinates to the image
add_grid: true
# Factor to downscale the image
ds_factor: 4
# Path to min and max values of the data
min_path: null
max_path: null
# Path to global means of the data
global_means_path: null
# Path to global stds of the data
global_stds_path: null
# --- Satellite earth embeddings (Alpha Earth / OLMO) -------------------------
# Embeddings are appended to the model input as extra channels. Two ways to
# select them (see datasets/cwb.py); a banner is always logged saying ON/OFF.
#
# PRIMARY — single file (the simple single-year path). Give one zarr file and it
# is appended to every sample; channel count is read from the file. Works for
# both new (`embedding` key) and legacy (`alpha_earth` key) stores. Takes
# precedence over the registry below. null = embeddings OFF.
embedding_path: null
#
# OPTIONAL — dormant per-year registry (multi-year). Only used when embedding_path
# is null AND embedding_source != none; builds paths under <root>/<source>/zarr/.
embedding_source: none         # none | alpha | olmo   (none = registry off)
embedding_version: v2_year     # v1_static (single fixed year) | v2_year (year-matched)
embedding_n: 1                 # 1 | 8   (start with 1: one embedding pixel per weather pixel)
embedding_region: taiwan       # taiwan | europa   (europa.yaml overrides to europa)
embedding_root: null           # regrid root; set explicitly in each run config that enables the registry
embedding_static_year: 2024    # only used when embedding_version: v1_static