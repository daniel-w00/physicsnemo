hydra:
    job:
          chdir: false
          name: generate_taiwan
    run:
          dir: ./outputs/${hydra:job.name}
    searchpath:
          - pkg://conf/base # Do not modify

# Base parameters for dataset, model, and generation
defaults:

    - dataset: cwb
    # The dataset type for training.
    # Accepted values:
    #   `gefs_hrrr`: full GEFS-HRRR dataset for continental US.
    #   `hrrr_mini`: smaller HRRR dataset (continental US), for fast experiments.
    #   `cwb`: full CWB dataset for Taiwan.
    #   `custom`: user-defined dataset. Parameters need to be specified below.

    - generation: non_patched
    # The base generation parameters.
    # Accepted values:
    #     `patched`: base parameters for a patch-based model
    #     `non_patched`: base parameters for a non-patched model


# Dataset parameters. Used for `custom` dataset type.
# Modify or add below parameters that should be passed as argument to the
# user-defined dataset class.
dataset:
    data_path: /data/cwa_dataset.zarr
    train: False
    all_times: True
    embedding_path: embeddings/alphaearth/taiwan/samesize/2024-conservative.zarr


# Generation parameters to specialize
generation:
    num_ensembles: 1
    # int, number of ensembles to generate per input
    seed_batch_size:   14   #4  # Anzahl Ensemble-Member pro Diffusions-Forward-Pass (höher = mehr VRAM, schnel
    # int, size of the batched inference
    hr_mean_conditioning: false  # Regressionsausgabe als zusätzliche Konditionierung für Diffusion (nur bei inference_mode: all)
    # Whether to use hr_mean_conditioning
    times_range:
     #   - ["2021-01-01T00:00:00", "2021-12-30T03:00:00", 3]
       - [ "2020-03-01T00:00:00", "2020-03-30T02:00:00", 6 ]
      #  - "2020-02-02T00:00:00"  # Startzeitpunkt (inklusiv)
       # - "2020-02-09T02:00:00"    # Endzeitpunkt (inklusiv)
       # -  "3H"               # Frequenz (z.B. '1H' für stündlich)

    times:
    # - 2021-02-02T00:00:00
    # - 2021-03-02T00:00:00
    # - 2021-04-02T00:00:00
    # hurricane
       - 2021-09-12T00:00:00
    #    - 2021-09-12T12:00:00
    # List[str], time stamps in ISO 8601 format. Replace and list desired target
    # time stamps.


    save_input: false
    # Skip saving LR input data to reduce output file size by ~55%
    inference_mode: regression #laut claude für nur regression #beides ist all          #falls nur regression flag setzen
    io:
       # res_ckpt_filename:  /checkpoints/taiwan/pure_lr5000/checkpoints_diffusion/EDMPrecondSuperResolution.0.1400064.mdlus
        # Path to checkpoint file for the diffusion model  
        reg_ckpt_filename: /checkpoints/taiwan/alpha-v1/checkpoints_regression/UNet.0.800000.mdlus
        # Path to checkpoint filename for the mean predictor model
        ##selbst hinzugefügt  überschreibt corrdiff_output.n
        output_filename: "output/alex/gen_taiwan/alphav1-reg-march2021_6h.nc"

# Parameters for wandb logging
wandb:
    mode: offline
    # Configure whether to use wandb: "offline", "online", "disabled"
