# Top-level training config: CorrDiff DIFFUSION on the Europa
# (Würzburg) dataset, running on the Alex cluster.
# Conditioned on the regression model trained at 2026-05-22 (run xzl9vnzo).

hydra:
    job:
          chdir: false
          name: europa_diffusion
    run:
          dir: ./output/${hydra:job.name}
    searchpath:
          - pkg://conf/base # Do not modify

# Base parameters for dataset, model, training, validation
defaults:
    - dataset: europa
    # Europa-specific channel layout (12 era5 channels, precipitation
    # at cwb index 3). See conf/base/dataset/europa.yaml.

    - model: diffusion
    # Diffusion UNet for residual predictions. Conditioned on the
    # regression output via hr_mean_conditioning below.

    - model_size: normal
    - training: ${model}

    - val_times_2021@_val_times
    # 256 curated validation timestamps (same set as regression).

# Dataset overrides (data path on Alex)
dataset:
    data_path: /anvme/workspace/b214cb18-ws-daniel2/wuerzburg450_corrdiff.zarr

# Diffusion is conditioned on the high-res mean (regression output).
model:
    hr_mean_conditioning: true
    embed: none               # none | alpha | olmo
    embed_version: v1         # v1 | v2 | na

# Training parameters
training:
    hp:
        training_duration: 1_500_000
        lr_rampup: 50_000
        total_batch_size: 256
        batch_size_per_gpu: 4     # diffusion peak mem ~ regression's; 40 GB should still fit with compile
    io:
        # Conditioning: regression UNet final checkpoint (2M samples).
        regression_checkpoint_path: /checkpoints/europa/reg_eu_pure_v1/checkpoints_regression/UNet.0.2000128.mdlus
        print_progress_freq: 4_000
        save_n_recent_checkpoints: 15
        save_checkpoint_freq: 100_000
        checkpoint_dir: /checkpoints/europa/diff_eu_v1   # separate from regression dir
        # validate every 5000 samples (default from base_all.yaml)
    perf:
      torch_compile: true       # ~5 min compile, then ~15-30% faster steps (same as regression)

# Validation: use only the 256 curated 2021 timestamps.
# get_zarr_dataset bypasses the year-2021 train/test split when
# include_times is set (forces all_times=True internally).
validation:
    train: false
    all_times: false
    include_times: ${_val_times.times}

# Parameters for wandb logging
wandb:
    mode: online
    results_dir: "./wandb"
    watch_model: false
    tags: ["diffusion", "europa"]   # mark stage + region in dashboard
    resume_id: null                  # set to existing wandb run id to resume logging
